<!DOCTYPE HTML>
<html>
	<head>
		<title>AI-Resolved Atmospheres | Fei Jiang</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<link rel="stylesheet" href="assets/css/main.css" />
		
		<style>
			/* 1. 全屏 Hero 背景设置 */
			#intro-wrapper {
				background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('images/banner.jpg');
				background-size: cover;
				background-position: center;
				background-attachment: fixed; /* 视差滚动效果 */
				min-height: 100vh; /* 强制全屏高度 */
				display: flex;
				flex-direction: column;
				justify-content: center;
				padding: 0;
				margin-bottom: 0;
			}
			
			/* 2. 首页大标题样式 */
			#intro-wrapper h1 {
				font-size: 4em;
				font-weight: 800;
				letter-spacing: -2px;
				color: #fff;
				text-shadow: 0px 4px 10px rgba(0,0,0,0.5);
			}
			
			#intro-wrapper p.style2 {
				font-size: 1.5em;
				color: rgba(255,255,255,0.9);
				font-weight: 300;
				max-width: 800px;
				margin: 0 auto 2em auto;
			}

			/* 3. 下拉箭头动画 */
			.arrow-container {
				margin-top: 3em;
				text-align: center;
			}
			.arrow-down {
				font-size: 3em;
				color: #fff;
				text-decoration: none;
				border: none;
				transition: opacity 0.3s;
				animation: bounce 2s infinite;
				cursor: pointer;
			}
			.arrow-down:hover {
				opacity: 0.7;
				color: #e95d3c; /* Highlight color */
			}
			@keyframes bounce {
				0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
				40% {transform: translateY(-15px);}
				60% {transform: translateY(-7px);}
			}

			/* 4. 项目卡片微调 */
			.highlight {
				background: #fff;
				padding: 2em;
				box-shadow: 0 10px 30px rgba(0,0,0,0.05);
				border-radius: 8px;
				transition: transform 0.3s ease;
			}
			.highlight:hover {
				transform: translateY(-5px);
			}
			.highlight h3 {
				font-size: 1.2em;
				font-weight: 700;
				margin-top: 1em;
			}
		</style>
	</head>
	<body class="homepage is-preload">
		<div id="page-wrapper">

			<div id="intro-wrapper">
				<div id="intro" class="container">
					
					<header class="style1">
						<h1>AI-Resolved Atmospheres</h1>
						<p class="style2">
							Constraining Global Aerosol Forcing via<br />
							<strong>Process-Guided Deep Learning</strong> & <strong>Observations</strong>
						</p>
					</header>
					
					<p class="style3" style="color: #ddd;">
						<strong>Fei Jiang</strong>
